[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interject"
version = "0.1.0"
description = "A durable ask() primitive: stop, ask a human, resume."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
authors = [{ name = "John Matti" }]
keywords = ["human-in-the-loop", "approval", "workflow", "durable", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]

dependencies = []
[project.urls]
Homepage = "https://github.com/TheJohnMatti/interject"
Repository = "https://github.com/TheJohnMatti/interject"
Issues = "https://github.com/TheJohnMatti/interject/issues"
Changelog = "https://github.com/TheJohnMatti/interject/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "pytest-xdist", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/interject"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
strict = true
python_version = "3.10"   # mypy no longer targets 3.9; runtime support stays >=3.9

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["interject"]

[tool.coverage.report]
# Ratchet this up as coverage improves; never down to make a red build green.
fail_under = 90
show_missing = true
