[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interject"
version = "0.0.1.dev0"
description = "A durable ask() primitive: stop, ask a human, resume."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "John Matti" }]
keywords = ["human-in-the-loop", "approval", "workflow", "durable", "pipeline"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/interject"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
strict = true
python_version = "3.10"   # mypy no longer targets 3.9; runtime support stays >=3.9
