name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The point of scheduled scanning is catching advisories published after a
    # change merged, so it must not only run on pushes.
    - cron: "17 4 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The web inbox is JavaScript embedded in HTML, and gets scanned too.
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
