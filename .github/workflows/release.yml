name: release

# Tag-driven, and nothing else: `git tag v0.1.0 && git push origin v0.1.0`.
# The version in the tag must match the version in the manifests, which is
# checked before anything is published — a release that half-succeeds across two
# registries is much worse than one that refuses to start.
on:
  push:
    tags: ["v*"]
  # Publish one registry for a tag that already shipped to the other. A PyPI
  # version is immutable, so re-running the whole workflow to catch crates.io up
  # would fail on the republish; this targets just the registry that is behind.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.1.0"
        required: true
        type: string
      python:
        description: "Publish to PyPI"
        type: boolean
        default: false
      rust:
        description: "Publish to crates.io"
        type: boolean
        default: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish_rust: ${{ steps.registries.outputs.publish_rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: registries
        # Secrets cannot be referenced in a job-level `if`, so the decision is
        # made here and passed down. This lets PyPI ship before crates.io is set
        # up, rather than holding one registry hostage to the other.
        run: |
          if [ -n "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "publish_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_rust=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipping crates.io"
          fi
      - id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PY=$(grep -m1 '^version = ' python/pyproject.toml | cut -d'"' -f2)
          RS=$(grep -m1 '^version = ' rust/Cargo.toml | cut -d'"' -f2)
          echo "tag=$VERSION python=$PY rust=$RS"
          [ "$PY" = "$VERSION" ] || { echo "::error::python/pyproject.toml says $PY, tag says $VERSION"; exit 1; }
          [ "$RS" = "$VERSION" ] || { echo "::error::rust/Cargo.toml says $RS, tag says $VERSION"; exit 1; }

  python:
    needs: verify
    if: github.event_name == 'push' || inputs.python
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write          # OIDC trusted publishing; no API token stored
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  rust:
    needs: verify
    if: >-
      needs.verify.outputs.publish_rust == 'true'
      && (github.event_name == 'push' || inputs.rust)
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # Only the client crate is published; interjectd ships as a binary.
      - run: cargo publish -p interject --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    # `always()` so a skipped crates.io job does not also skip the release; the
    # python job still has to have succeeded.
    needs: [python, rust]
    # Only on a tag push: a manual run is catching a registry up on a tag whose
    # GitHub release already exists.
    if: >-
      always() && github.event_name == 'push'
      && needs.python.result == 'success' && needs.rust.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
