[workspace]
resolver = "2"
members = ["interject", "interjectd"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/TheJohnMatti/interject"
authors = ["John Matti"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
